[package]
name = "cynapse-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for cynapse (ratatui), plus re-export of cynapse-core."
license = "MIT"

[dependencies]
cynapse-core = { path = "../cynapse-core" }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
anyhow = "1"

[dev-dependencies]
crossterm = "0.29"
