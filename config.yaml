# Cynapse (Rust) local config.
#
# Loaded from the working directory (falling back to ~/.cynapse/config.yaml,
# then built-in defaults). Paths resolve relative to the current working
# directory — run the binary from this repo root.
gateway:
    address: 0.0.0.0:8080
    auth_token: ""
llm:
    provider: leafcutter
    model: Ornith-1.5-9B-Q4_K_M.gguf
    anthropic_key: ""
    openai_key: ""
    gemini_key: ""
    openai_base_url: ""
    ollama_base_url: http://localhost:11434
    llama_server_path: ""
    leafcutter_path: ""
    local_gpu_layers: 0
    local_context_size: 8192
    local_threads: 10
    models_dir: ""
    max_tokens: 4096
    temperature: 0.7
    max_retries: 3
memory:
    persona_path: ./persona/devices
    sessions_path: ./data/sessions
    db_path: ./data/memory.db
    dendrite_db_path: ./data/dendrite.db
    defaults_path: ./persona/defaults
    heartbeat_interval_hours: 6
    max_session_messages: 100
tools:
    profile: standard
    allow: []
    deny: []
    work_dir: ./workspace
    timeout_seconds: 60
mcp:
    enabled: false
    servers: []
models:
    models_dir: ./models
    use_ollama: true
    use_llama_server: false
    hf_token: ""
security:
    mode: standard
    redact_secrets: ~
    net_policy: local-dev
    approval_policy: balanced
backup_keep: 5
tui:
    theme: default
